[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tetravite-runtime"
version = "0.1.0"
description = "Reference executor for trusted TETRAVITE v1alpha1 packages"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "jsonschema>=4.23,<5"]

[project.scripts]
tetravite = "tetravite_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
